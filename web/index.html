<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fact Checker</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div class="wordmark">
      <img class="logo-mark" src="img/Icon-L-Cat-Laying-tail-up-Orange.svg" alt="" width="40" height="40" />
      <span class="wordmark-text">Fact Checker</span>
    </div>
    <div class="controls">
      <label for="checking-switch" class="switch-label">Fact checking</label>
      <button type="button" role="switch" aria-checked="false" id="checking-switch" class="switch"></button>
    </div>
  </header>

  <main>
    <div class="video-column">
      <section id="video-panel">
        <video id="video" src="video/claims.mp4" controls playsinline></video>
      </section>

      <section id="upload-section">
        <label for="video-upload-input" class="upload-button">
          <svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true">
            <path d="M8 1v9M4.5 5.5 8 2l3.5 3.5M2 12.5v1.5a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1v-1.5" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          Upload new video
        </label>
        <input type="file" id="video-upload-input" accept="video/*" hidden />
      </section>
    </div>

    <section id="results-panel">
      <div id="results-empty">Turn on "Fact checking" above to start... checking facts!</div>
      <div id="results-list"></div>
    </section>
  </main>

  <dialog id="upload-dialog">
    <div class="upload-status">
      <span class="spinner" aria-hidden="true"></span>
      <span>Compressing video&hellip;</span>
    </div>
  </dialog>

  <footer></footer>

  <script src="app.js"></script>
</body>
</html>
